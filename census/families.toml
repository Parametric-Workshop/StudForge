# Families: first guesses at which parametric generator each shape belongs to,
# based on words in its Rebrickable name. Only categories listed here get a
# family level in the census viewer; shapes in other categories sit directly
# under their category.
#
# For each category, rules are checked in order and the first match wins. A rule
# matches when any of its words appears in the shape's name; a word starting with
# "re:" is a regular expression. The last rule has no words and catches the rest.
#
# These are guesses for browsing. Settle a category's families properly before
# writing its generator.

