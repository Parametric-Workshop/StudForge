# Category groups: how the census viewer gathers Rebrickable categories of the
# standard brick system into a level of its own. Each group lists the Rebrickable
# categories it contains; every standard category must appear in exactly one group.
# Groups are for browsing only; families (families.toml) decide how shapes are modeled.

[groups]
"Plates" = [
    "Plates",
    "Plates Special",
    "Plates Round Curved and Dishes",
    "Plates Wedged",
    "Baseplates",
]
"Bricks" = [
    "Bricks",
    "Bricks Sloped",
    "Bricks Curved",
    "Bricks Special",
    "Bricks Round and Cones",
    "Bricks Wedged",
]
"Technic" = [
